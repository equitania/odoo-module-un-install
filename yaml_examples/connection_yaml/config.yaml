---
# Server configuration
Server:
    url: https://odoo.com                             # URL to Odoo - for localhost write http://localhost
    port: 443                                         # Port of Odoo - Remote over SSL write 443 - for localhost write 8069 or other Odoo port
    user: admin                                       # Your Odoo admin-user or user with setting rights
    password: pw                                      # Password for the user (optional - can be entered interactively or stored in keyring)
    database: db                                      # Name of the Odoo database (optional - can be selected interactively if multiple exist)
    use_keyring: true                                 # Whether to store/retrieve password in system keyring (default: true)